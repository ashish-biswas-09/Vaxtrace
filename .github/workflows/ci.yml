name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # TODO 3.3: service-role key must never reach the client bundle.
      - name: Assert no service-role key in client bundle
        run: |
          if grep -r "SUPABASE_SERVICE_ROLE_KEY" apps/web/.next/static 2>/dev/null; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY leaked into the client bundle"
            exit 1
          fi
